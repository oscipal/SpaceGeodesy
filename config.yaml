# Single source of parameters for the Svartsengi InSAR pipeline.
# Scripts read everything from here; nothing is hard-coded.
# Values marked TODO are filled by the stage named next to them.

project: svartsengi-insar

paths:
  data: data              # raw LiCSAR downloads + LiCSBAS working dirs (git-ignored)
  results: results
  figures: figures
  logs: logs
  docs: docs

# --- Locations (approximate, from the project plan) -------------------------
sites:
  svartsengi_uplift_centre: {lat: 63.866, lon: -22.458}  # peak of the decomposed vertical (full resolution, 1 km smoothing), mean of 2020, Jun-Aug 2024, Dec 2024-Mar 2025 inflation; was 63.88, -22.43 (plan), 63.868, -22.439 (preview)
  grindavik:                {lat: 63.84, lon: -22.43}
  sundhnukur_crater_row:    {lat_min: 63.87, lat_max: 63.90, lon_min: -22.40, lon_max: -22.35}

# Processing AOI (clip box for LiCSBAS step 05).
# Extended north-east from the plan's original box (lon -22.70..-22.15, lat 63.75..64.00):
# every edge of that box was < 15 km from the uplift centre, so it had no room for a
# stable reference area. The extension reaches stable ground towards Vogar/Hafnarfjordur.
aoi:
  lon_min: -22.70
  lon_max: -21.95
  lat_min: 63.75
  lat_max: 64.05

# Areas with their own deformation / decorrelation: kept in the data, excluded from
# reference-point selection, outlined in figures. Boxes are approximate; refine later.
exclusion_zones:
  fagradalsfjall:  {lon_min: -22.33, lon_max: -22.18, lat_min: 63.85, lat_max: 63.93, note: "2021-2023 dikes and lava fields"}
  sundhnukur_grindavik: {lon_min: -22.50, lon_max: -22.30, lat_min: 63.82, lat_max: 63.92, note: "dikes and lava since Nov 2023"}
  krysuvik:        {lon_min: -22.15, lon_max: -21.95, lat_min: 63.85, lat_max: 63.95, note: "Krysuvik system has its own unrest"}

# --- Time window --------------------------------------------------------------
time:
  start: 2020-01-01
  end: null               # null = latest available acquisition
  download_chunk: yearly  # download in yearly chunks so failures don't restart everything

# --- LiCSAR frames (Stage 1: scripts/find_frames.py) ------------------------
licsar:
  base_url: https://gws-access.jasmin.ac.uk/public/nceo_geohazards/LiCSAR_products
  candidate_tracks: [16, 155]   # from earlier studies; verified in Stage 1
  neighbour_tracks: []          # extra tracks to search if a geometry has poor coverage
  frames:                       # set by scripts/find_frames.py
    ascending: 016A_02504_162118
    descending: 155D_02484_191814

download:
  # AOI-clipped download (scripts/download.py) instead of LiCSBAS01 full frames:
  # full frames would be ~450 GB (asc) + ~175 GB (desc). Output layout matches LiCSBAS01.
  max_gb_per_frame: 80          # pre-approved cap (on-disk size); stop and ask above this
  get_gacos: true
  n_parallel: 6                 # concurrent remote reads
  gacos_margin_deg: 0.05        # GACOS clipped with margin; LiCSBAS03op warps it to the GEOC grid
  retry_missing: false          # re-check ifgs/epochs previously recorded as unavailable

# --- LiCSBAS (Stage 3) -----------------------------------------------------------
licsbas:
  n_look: 1                     # ~100 m pixels
  gacos: true                   # step 03op; GACOS complete for all epochs of both frames (Stage 2)
  mask: false                   # step 04op
  clip: false                   # step 05op not needed: download.py already clips to the AOI
  n_para: 2                     # LiCSBAS workers (12 workers were OOM-killed in the 7.6 GB Docker VM)
  mem_size_mb: 160              # step 13 patch budget (~8-row patches); its gap/loop count needs ~n_loop x n_pixel x 8 B per worker
                                # (27k loops: 6.7 GB per worker at the auto size; 3 GB and OOM on land patches at 600 MB / 16 rows)
  skip_pngs: true               # skip per-loop/per-ifg PNGs in steps 12, 13, 16 (tens of thousands); summary QC PNGs are kept
  # Common reference window for both frames. null/auto = chosen by run_licsbas.py from
  # coherence; to fix it yourself: {lat: .., lon: .., window_px: 5, source: manual}
  reference_point: {lat: 64.0458, lon: -22.0243, window_px: 5, source: manual, mean_coh: {016A_02504_162118: 0.62, 155D_02484_191814: 0.638}, distance_km: 27.1}  # auto-selected by run_licsbas.py on 2026-11-02, fixed (manual) so moving the centre does not change it
  reference_selection:
    window_px: 5                # 5 x 5 px = 500 m
    min_distance_km: 24         # from svartsengi_uplift_centre; 15 km (plan minimum) gave a town window at 15.3 km, 24 km cuts reference contamination ~3x at equal coherence
    min_unw_fraction: 0.95      # every window pixel unwrapped in >= 95 % of ifgs (after step 11)
    exclusion_buffer_deg: 0.01  # keep this far from exclusion_zones
  # thresholds: null = LiCSBAS defaults; tune per period only with documented reason
  thresholds:
    coh_thre: null              # step 11 coherence threshold
    unw_thre: null              # step 11 unwrapped-fraction threshold
    loop_thre: null             # step 12 loop closure threshold (rad)
    n_ifg_noloop_thre: 50       # step 15: mask pixels with more ifgs without a closed loop than this. LiCSBAS
                                # default = (ifgs without any loop in the network) + 1 = 1 here, which masked 21 % (asc)
                                # / 39 % (desc) incl. the uplift centre, where only ~5 of ~3100 ifgs lack a loop;
                                # 50 is the C-band value suggested in LiCSBAS15_mask_ts.py
  # Per-frame step-12 settings (only loop_thre and nullify; steps 02-11 are shared by both frames).
  frame_overrides:
    155D_02484_191814:
      loop_thre: 3.0            # at 1.5 rad step 12 rejected all 10 descending ifgs across the 10 Nov 2023 dike
                                # (scene loop RMS 2-28 rad) and split the network at 20231110-20231122 and
                                # 20231216-20240109. Their loop errors are at the dike (54-59 % of pixels fail
                                # to close there, 3-4 % elsewhere); 3 rad keeps 7 + 5 ifgs across the two gaps
                                # and still drops 48 (e.g. the 20231228 loops at 21+ rad)
      nullify: true             # LiCSBAS12 --nullify: blank pixels whose loops all exceed pi, which removes the
                                # dike-zone unwrapping errors of the ifgs that the higher threshold lets in
  filter:                       # step 16
    filtwidth_km: null
    filtwidth_yr: null

# --- Post-processing (Stage 4) --------------------------------------------------
postprocess:
  ts_window_px: 3               # averaging window for point time series
  extra_points: []              # [{name: ..., lat: ..., lon: ...}]
  events_csv: config/events.csv

# --- GNSS (Stage 6) --------------------------------------------------------------
gnss:
  source: ngl                   # Nevada Geodetic Laboratory, daily IGS20 tenv3
  search_radius_km: 15
  # All NGL stations within 15 km of the uplift centre with data since 2020, from the NGL
  # station list (DataHoldings.txt, checked 2026-11-17), nearest first. SKSH and SENG cover
  # 2020-2026; the others start in Nov 2023 or later.
  stations: [GRIV, HS02, SKSH, SENG, ORFC, VMOS, AUSV, ELD1, GEVK, NBIO, SUDV, NAMC, FEFC, VOGC]
  # Reykjavik, 39 km from the centre and 11 km from the InSAR reference (Straumsvik), outside
  # the InSAR area; all stations are taken relative to it.
  reference_station: REYK
  step_window_days: 15          # +- days for fitting antenna-change offsets
  outliers:                     # research plan: outliers are removed (robust running median, split at events)
    window_days: 15
    k: 5
    protect_days: 10            # not tested after each dike or eruption (fast real motion)
